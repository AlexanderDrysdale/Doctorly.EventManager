<mat-card class="error-card mat-elevation-z8">
  <mat-card-header>
    <mat-card-title>Error</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="error-content">
      <mat-icon color="warn" class="error-icon">error_outline</mat-icon>
      <h2>Something went wrong</h2>
      <p>We couldn’t load the requested page. Please try again later.</p>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="primary" routerLink="/">Go Back Home</button>
  </mat-card-actions>
</mat-card>
